<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>솔크메크 신청</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
    --plum: #3B1D5E;
    --plum-deep: #1E0F33;
    --violet: #8A5CD0;
    --lilac: #EDE3FB;
    --pop: #FFD23F;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--plum-deep); color: var(--white); font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-family: 'Bungee', sans-serif; font-weight: 400; color: var(--pop); font-size: 36px; margin-bottom: 8px; }
  .sub { font-weight: 700; margin-bottom: 28px; }
  label { display: block; font-weight: 700; margin: 18px 0 6px; }
  input[type=text], input[type=tel] { width: 100%; padding: 12px; font-size: 16px; border: none; background: var(--white); color: var(--plum-deep); }
  .opt { display: flex; align-items: center; gap: 10px; background: var(--violet); padding: 14px; margin-top: 8px; cursor: pointer; }
  .opt input { accent-color: var(--pop); width: 18px; height: 18px; }
  .opt b { margin-left: auto; font-family: 'Bungee', sans-serif; }
  .note { font-size: 14px; margin-top: 18px; opacity: 0.85; }
  button { width: 100%; margin-top: 28px; padding: 16px; font-size: 18px; font-weight: 900; background: var(--pop); color: var(--plum-deep); border: none; }
  button:disabled { opacity: 0.5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>솔크메크 신청</h1>
  <div class="sub">12월 26일 토요일 · 13:00 — 21:00 · 신논현점</div>
  <form onsubmit="return false;">
    <label for="name">이름</label>
    <input type="text" id="name" name="name" required>
    <label for="phone">연락처</label>
    <input type="tel" id="phone" name="phone" required>
    <label>참가 유형</label>
    <label class="opt"><input type="radio" name="type" value="normal" checked>일반 참가 <b>50,000원</b></label>
    <label class="opt"><input type="radio" name="type" value="limited">6명 한정 <b>80,000원</b></label>
    <div class="note">6명 한정 · 선착순 마감 · 현금 결제</div>
    <button type="submit" disabled>신청 준비 중</button>
  </form>
</div>
</body>
</html>
