<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>솔크메크 신청</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
    --plum: #3B1D5E;
    --plum-deep: #1E0F33;
    --violet: #8A5CD0;
    --lilac: #EDE3FB;
    --pop: #FFD23F;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--plum-deep); color: var(--white); font-family: 'Noto Sans KR', sans-serif; font-weight: 900; min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-family: 'Noto Sans KR', sans-serif; font-weight: 900; color: var(--pop); font-size: 36px; margin-bottom: 8px; }
  .sub { font-weight: 700; margin-bottom: 28px; }
  label { font-weight: 900; display: block; font-weight: 700; margin: 18px 0 6px; }
  input::placeholder { color: #8a7a9a; font-weight: 700; }
  input[type=text], input[type=tel], input[type=email] { width: 100%; padding: 12px; font-size: 16px; border: none; background: var(--white); color: var(--plum-deep); }
  .opt { display: flex; align-items: center; gap: 10px; background: var(--violet); padding: 14px; margin-top: 8px; cursor: pointer; }
  .opt input { accent-color: var(--pop); width: 18px; height: 18px; }
  .opt b { margin-left: auto; font-family: 'Bungee', sans-serif; }
  .note { font-size: 14px; margin-top: 18px; opacity: 0.85; }
  .tip { position: relative; display: inline-block; margin-left: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--pop); color: var(--plum-deep); text-align: center; font-size: 13px; font-weight: 900; line-height: 20px; cursor: help; }
  .tip::after { content: attr(data-tip); position: absolute; bottom: 140%; left: 50%; transform: translateX(-50%); background: var(--plum-deep); color: var(--white); padding: 8px 10px; font-size: 13px; font-weight: 700; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; }
  .tip:hover::after, .tip:focus::after { opacity: 1; }
  .opt small { font-size: 12px; font-weight: 700; }
  label, .opt, .opt b { color: var(--pop); }
  .opt .seller-name { color: var(--white); }
  button { width: 100%; margin-top: 28px; padding: 16px; font-size: 18px; font-weight: 900; background: var(--pop); color: var(--plum-deep); border: none; }
  button:disabled { opacity: 0.5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>솔크메크 같이 보내기</h1>
  <form id="signup-form">
    <label for="nick">닉네임</label>
    <input type="text" id="nick" name="nick" placeholder="유튜브 구독자명으로 입력해주세요" required>
    <label for="name">이름</label>
    <input type="text" id="name" name="name" placeholder="이메천" required>
    <label for="phone">연락처</label>
    <input type="tel" id="phone" name="phone" placeholder="010-5252-8253" required>
    <label for="email">이메일</label>
    <input type="email" id="email" name="email" placeholder="ditto@metamong.com" required>
    <label>참가 유형</label>
    <label class="opt"><input type="radio" name="type" value="normal" checked><span class="seller-name">같이 놀기</span> <b>50,000원</b></label>
    <label class="opt"><input type="radio" name="type" value="seller"><span class="seller-name">셀러도 하고 싶어요 (6명 한정)</span> <span class="tip" tabindex="0" data-tip="셀러 참가 시 책임 있는 진행을 위한 관리비 3만원이 추가됩니다">?</span> <b>80,000원</b></label>
    <button type="submit" id="submit-btn" disabled>신청 준비 중</button>
  </form>
</div>
<script>
(function(){
  // 구글 앱스크립트 웹앱 URL을 여기에 넣으면 제출이 시트로 들어갑니다.
  var SHEET_URL = 'https://script.google.com/macros/s/AKfycbziLIX-lnp0nPfuhdkPo1dhYpEMLEZWoudHC-aVJ6TKVxagcUJVlQ-JOKSfFTnCDS9izg/exec';
  var form = document.getElementById('signup-form');
  var btn = document.getElementById('submit-btn');
  if (SHEET_URL) { btn.disabled = false; btn.textContent = '신청하기'; }
  form.addEventListener('submit', function(e){
    e.preventDefault();
    if (!SHEET_URL) return;
    var type = form.querySelector('input[name=type]:checked').value === 'seller' ? '셀러 6명 한정 80,000원' : '같이 놀기 50,000원';
    var data = { nick: form.nick.value, name: form.name.value, phone: form.phone.value, email: form.email.value, type: type };
    btn.disabled = true; btn.textContent = '전송 중...';
    fetch(SHEET_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) })
      .then(function(){ alert('신청이 접수됐습니다.'); form.reset(); })
      .catch(function(){ alert('전송에 실패했습니다. 다시 시도해 주세요.'); })
      .finally(function(){ btn.disabled = false; btn.textContent = '신청하기'; });
  });
})();
</script>
</body>
</html>
